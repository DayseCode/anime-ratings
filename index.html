<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark' }
      catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <script>
      /* colour theme ("skin") + dark/light, applied before the first paint so nothing flashes.
         The skin ids / font URLs must match src/skins.js. v = SKIN_VERSION there. */
      (function () {
        var root = document.documentElement, skin = 'sakura', v = '3', g = 'https://fonts.googleapis.com/css2?family='
        var fonts = {
          purple: g + 'Inter:wght@400;500;600;700;800&display=swap',
          calm: g + 'Onest:wght@400;500;600;700;800&display=swap',
          neon: g + 'Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap'
        }
        try { skin = localStorage.getItem('skin') || skin } catch (e) {}
        if (!/^(sakura|neon|calm|purple)$/.test(skin)) skin = 'sakura'
        root.dataset.skin = skin
        document.write('<link id="skin-css" rel="stylesheet" href="/themes/' + skin + '.css?v=' + v + '">')
        if (fonts[skin]) document.write('<link id="skin-font" rel="stylesheet" href="' + fonts[skin] + '" media="print" onload="this.media=\'all\'">')
      })()
    </script>
    <title>Anime OP / ED / Insert Ratings</title>
    <link rel="icon" type="image/x-icon" href="/favlogo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
